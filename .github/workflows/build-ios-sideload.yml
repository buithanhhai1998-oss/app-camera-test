name: Flutter iOS Sideload Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA (Sideload-Ready, Unsigned)
    runs-on: macos-14 # Apple Silicon M1/M2 runner

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: .
          fetch-depth: 0

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Accept Xcode License
        run: sudo xcodebuild -license accept

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:'

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            app/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache CocoaPods Specs and Pods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            app/ios/Pods
            app/ios/.symlinks
          key: pods-${{ runner.os }}-${{ hashFiles('app/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate Flutter Xcode Build Configs
        run: flutter build ios --config-only --no-codesign

      - name: Sanitize Entitlements for Free Apple ID
        run: |
          ENTITLEMENTS_FILE="ios/Runner/Runner.entitlements"
          if [ -f "$ENTITLEMENTS_FILE" ]; then
            cat << 'EOF' > "$ENTITLEMENTS_FILE"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          EOF
            echo "Sanitized $ENTITLEMENTS_FILE to empty dictionary."
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
        env:
          COCOAPODS_DISABLE_STATS: 'true'

      - name: Build Unsigned iOS Release
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-number ${{ github.run_number }}

      - name: Package Payload into IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -r -y Runner.ipa Payload
          echo "IPA Size: $(du -sh Runner.ipa | cut -f1)"

      - name: Generate SHA256 Checksum
        run: |
          cd build/ios/ipa
          shasum -a 256 Runner.ipa > Runner.ipa.sha256
          cat Runner.ipa.sha256

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ios-release-ipa
          path: |
            app/build/ios/ipa/Runner.ipa
            app/build/ios/ipa/Runner.ipa.sha256
          retention-days: 7

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/ios/ipa/Runner.ipa
            app/build/ios/ipa/Runner.ipa.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update AltSource on gh-pages branch (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd ..
          IPA_PATH="app/build/ios/ipa/Runner.ipa"
          IPA_SIZE=$(stat -f%z "$IPA_PATH" 2>/dev/null || stat -c%s "$IPA_PATH")
          VERSION="${GITHUB_REF_NAME#v}"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Runner.ipa"

          python3 tools/update_altsource.py \
            --input altsource/apps.json \
            --output altsource/apps.json \
            --version "$VERSION" \
            --download-url "$DOWNLOAD_URL" \
            --size "$IPA_SIZE" \
            --description "Automated build for $GITHUB_REF_NAME"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash or commit to gh-pages branch if it exists
          if git ls-remote --exit-code --heads origin gh-pages; then
            git checkout gh-pages
            cp altsource/apps.json apps.json
            git add apps.json
            git commit -m "Update AltSource for release $GITHUB_REF_NAME [skip ci]" || echo "No changes"
            git push origin gh-pages
          fi
