name: flutter_sideload_app
description: "A production Flutter application optimized for iOS Sideloading from Windows."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # UI / Cupertino Simulation
  cupertino_icons: ^1.0.8
  device_preview: ^1.2.0

  # Safe Local-First Storage (100% Sideload Compatible)
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Biometric Auth (Safe Info.plist permission only)
  local_auth: ^2.2.0

  # Media & Hardware (Safe Info.plist permissions only)
  camera: ^0.11.0+1
  video_player: ^2.9.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.4

dependency_overrides:
  shared_preferences_foundation: 2.5.7
  video_player_avfoundation: 2.10.0

flutter:
  uses-material-design: true
